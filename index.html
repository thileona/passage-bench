<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2334d">
<meta name="description" content="Suspension HEK293 shake-flask passaging: calculators, protocol and key concepts.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Passage Bench">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>HEK293 Passage Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first single column (max 600px), screen switched by a bottom tab bar. Accent = phenol red, loop/tool colour = teal. */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --sunk: #eceef3;
  --fg: #1b2230;
  --muted: #5d6677;
  --line: #d9dde5;
  --accent: #c2334d;
  --accent-soft: #fbe8ec;
  --teal: #1f6f78;
  --teal-soft: #e2f1f2;
  --warn: #8f5500;
  --warn-soft: #fdf1dc;
  --bad: #b3261e;
  --bad-soft: #fde7e5;
  --good: #22713a;
  --good-soft: #e3f3e7;
  --ph-acid: #e7c33a;
  --ph-ok: #d9475c;
  --ph-alk: #a8358b;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111419; --surface: #1a1f28; --sunk: #141820; --fg: #e8ebf1; --muted: #9aa3b2; --line: #2d3440;
  --accent: #f0788c; --accent-soft: #3a1f26; --teal: #6cc3cb; --teal-soft: #173033;
  --warn: #f2b35a; --warn-soft: #36291a; --bad: #ff8a80; --bad-soft: #3b1e1c; --good: #7fd495; --good-soft: #183020; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111419; --surface: #1a1f28; --sunk: #141820; --fg: #e8ebf1; --muted: #9aa3b2; --line: #2d3440;
  --accent: #f0788c; --accent-soft: #3a1f26; --teal: #6cc3cb; --teal-soft: #173033;
  --warn: #f2b35a; --warn-soft: #36291a; --bad: #ff8a80; --bad-soft: #3b1e1c; --good: #7fd495; --good-soft: #183020; color-scheme: dark }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); padding-inline: 16px; padding-block: 18px 110px }
.app { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0 }
h1 { font-size: 26px; line-height: 1.1; font-weight: 700 }
h2 { font-size: 21px; line-height: 1.2; font-weight: 700 }
h3 { font-size: 17px; line-height: 1.25; font-weight: 500 }
p { margin: 0 }
.eyebrow { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
.label { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.small { font-size: 14px }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px }
.top .sub { color: var(--muted); font-size: 14px }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }

/* tool list */
.tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px }
.tool { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; color: var(--fg); font: inherit; cursor: pointer }
.tool:hover { border-color: var(--teal) }
.tool .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font: 500 15px/1 var(--mono) }
.tool b { display: block; font-weight: 600 }
.tool span.d { display: block; font-size: 14px; color: var(--muted); line-height: 1.35 }
.tool .chev { color: var(--muted); font-family: var(--mono) }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 4px }

/* calculator */
.back { background: none; border: none; color: var(--teal); font: 600 15px/1 var(--body); padding: 6px 0; cursor: pointer; align-self: flex-start }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
@media (max-width: 380px) { .fields { grid-template-columns: minmax(0, 1fr) } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field.full { grid-column: 1 / -1 }
.field label { font-size: 13px; color: var(--muted); line-height: 1.25 }
.inp { position: relative }
.inp input { width: 100%; font: 500 18px/1.2 var(--mono); color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 11px 64px 11px 12px; font-variant-numeric: tabular-nums }
.inp .u { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 400 12px/1 var(--mono); color: var(--muted); pointer-events: none }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chip { font: 500 10px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 3px 7px; background: var(--warn-soft); color: var(--warn); white-space: nowrap }
.chip.ok { background: var(--good-soft); color: var(--good) }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px }
.seg button { border: none; background: none; color: var(--muted); font: 600 14px/1.2 var(--body); padding: 9px 6px; border-radius: 7px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12) }

.results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.res { background: var(--sunk); border-radius: 12px; padding: 12px; min-width: 0 }
.res.big { grid-column: 1 / -1; background: var(--teal-soft) }
.res span { display: block; font-size: 13px; color: var(--muted); line-height: 1.3 }
.res b { display: block; font: 500 22px/1.25 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.res.big b { font-size: 30px; color: var(--teal) }
.res i { display: block; font-style: normal; font: 400 12px/1.35 var(--mono); color: var(--muted); margin-top: 3px }
.msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45 }
.msg.warn { background: var(--warn-soft); color: var(--warn) }
.msg.bad { background: var(--bad-soft); color: var(--bad) }
.msg.good { background: var(--good-soft); color: var(--good) }
.msg.info { background: var(--sunk); color: var(--fg) }
.formula { font: 400 13px/1.6 var(--mono); background: var(--sunk); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre }
details.how summary { cursor: pointer; font-weight: 600; color: var(--teal); list-style: none }
details.how summary::-webkit-details-marker { display: none }
details.how summary::before { content: "+ "; font-family: var(--mono) }
details.how[open] summary::before { content: "− " }
details.how > div { margin-top: 10px; display: flex; flex-direction: column; gap: 8px }

/* protocol */
.steps { display: flex; flex-direction: column; gap: 8px }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.step summary { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 13px 14px; cursor: pointer; list-style: none }
.step summary::-webkit-details-marker { display: none }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font: 500 13px/1 var(--mono) }
.step.side .n { background: var(--sunk); color: var(--muted) }
.step summary b { font-weight: 600 }
.step summary span.s { display: block; font-size: 13px; color: var(--muted) }
.step summary .chev { font-family: var(--mono); color: var(--muted); transition: transform .15s }
.step[open] summary .chev { transform: rotate(90deg) }
.step .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px }
ul.list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px }
ul.list li::marker { color: var(--teal) }
.confirm { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px }
.confirm .label { color: var(--warn) }
.confirm ul.list li::marker { color: var(--warn) }
.timer { font: 600 13px/1 var(--body); color: var(--teal); background: var(--teal-soft); border: 1px solid var(--teal); border-radius: 8px; padding: 7px 10px; cursor: pointer; margin-top: 6px; font-variant-numeric: tabular-nums }
.timer.run { background: var(--accent-soft); color: var(--accent); border-color: var(--accent) }
.timer.end { background: var(--good-soft); color: var(--good); border-color: var(--good) }
.check label .tw { display: flex; flex-direction: column; align-items: flex-start }
.setpoints { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px }
.sp { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4 }
.sp b { display: block; font-size: 14px }
.sp span { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.loopnote { font: 500 12px/1.3 var(--mono); color: var(--teal); text-align: center; padding: 2px 0 }

/* checklist */
.check { display: flex; flex-direction: column; gap: 2px }
.check label { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 10px; align-items: start; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; line-height: 1.4 }
.check label:last-child { border-bottom: none }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--teal) }
.check input:checked + span { color: var(--muted); text-decoration: line-through }
.check .grp { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); padding: 12px 4px 4px }
.progress { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--teal); width: 0; transition: width .2s }

/* learn */
.concept p + p { margin-top: 8px }
.phrow { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px }
.ph { border-radius: 10px; border: 1px solid var(--line); padding: 10px; font-size: 13px; line-height: 1.35 }
.ph i { display: block; height: 26px; border-radius: 6px; margin-bottom: 8px }
.ph b { display: block; font-size: 14px }
table.kv { width: 100%; border-collapse: collapse; font-size: 14px }
table.kv td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top }
table.kv td:first-child { color: var(--muted); width: 46% }
table.kv td:last-child { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums }
table.kv tr:last-child td { border-bottom: none }
.gloss dt { font-weight: 600; margin-top: 10px }
.gloss dt:first-child { margin-top: 0 }
.gloss dd { margin: 2px 0 0; color: var(--muted); font-size: 14px }
.svgwrap { overflow-x: auto }
.svgwrap svg { display: block; width: 100%; min-width: 300px; height: auto }
.train { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px }
.train span.b { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--sunk) }
.train span.b.me { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); font-weight: 600 }
.train span.a { color: var(--muted); font-family: var(--mono) }

/* settings */
.set { display: grid; grid-template-columns: minmax(0,1fr) 150px; gap: 8px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.set:last-child { border-bottom: none }
.set .t { font-weight: 600; font-size: 15px; line-height: 1.3 }
.set .h { font-size: 13px; color: var(--muted); line-height: 1.35 }
.set .conf { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted) }
.set .conf input { accent-color: var(--good); width: 18px; height: 18px; margin: 0 }
.set .inp input { font-size: 16px; padding: 9px 52px 9px 10px }
textarea { width: 100%; min-height: 110px; font: 400 15px/1.5 var(--body); color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical }
.btn { font: 600 15px/1 var(--body); color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer }
.btn:hover { border-color: var(--fg) }
.btn.danger { color: var(--bad) }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 10 }
.tabbar .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 2px }
.tabbar button { background: none; border: none; color: var(--muted); font: 600 12px/1.1 var(--body); padding: 6px 2px 4px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px }
.tabbar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
.tabbar button[aria-current="page"] { color: var(--accent); background: var(--accent-soft) }
/* labels */
.idlist { display: flex; flex-direction: column; gap: 8px }
.idrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; background: var(--sunk); border-radius: 10px; padding: 10px 10px 10px 12px }
.idrow code, code.id { font: 500 15px/1.35 var(--mono); overflow-wrap: anywhere; color: var(--fg) }
.idrow.big { background: var(--teal-soft) }
.idrow.big code { font-size: 17px; color: var(--teal) }
.idrow small { display: block; font: 400 12px/1.3 var(--body); color: var(--muted); margin-top: 2px; word-break: normal }
.copy { font: 600 13px/1 var(--body); color: var(--teal); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; white-space: nowrap }
.copy.done { color: var(--good); border-color: var(--good) }
.field input[type=text], .field input[type=date], .field select { width: 100%; font: 500 17px/1.2 var(--mono); color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; text-transform: uppercase }
.field input[type=date], .field select { text-transform: none; font-size: 16px; font-family: var(--body) }
.field input:disabled { opacity: .45 }
.seg.wrap4 { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0,1fr)) }
@media (max-width: 380px) { .seg.wrap4 { grid-template-columns: repeat(2, minmax(0,1fr)) } }
.anatomy { display: flex; flex-wrap: wrap; gap: 4px; font: 500 14px/1 var(--mono) }
.anatomy span { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 7px; border-radius: 8px; background: var(--sunk) }
.anatomy span i { font: 400 10px/1.1 var(--body); font-style: normal; color: var(--muted); text-align: center; max-width: 76px }
.anatomy span.p { background: var(--warn-soft); color: var(--warn) }
.anatomy span.c { background: var(--teal-soft); color: var(--teal) }
.anatomy span.d { background: var(--accent-soft); color: var(--accent) }
.flask-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px }
.flask-card.gen0 { border-color: var(--teal) }
.flask-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted) }
.pill { font: 500 11px/1 var(--mono); border-radius: 999px; padding: 4px 8px; background: var(--sunk); color: var(--muted); white-space: nowrap }
.pill.active { background: var(--teal-soft); color: var(--teal) }
.pill.backup { background: var(--sunk); color: var(--muted) }
.pill.discard { background: var(--warn-soft); color: var(--warn) }
.pill.old { background: var(--bad-soft); color: var(--bad) }
.mini { display: flex; flex-wrap: wrap; gap: 6px }
.mini button { font: 600 13px/1 var(--body); color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer }
.mini button.primary { color: var(--teal); border-color: var(--teal) }
.mini button.danger { color: var(--bad) }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--muted); font-size: 14px }
.rules h3 { margin-top: 4px }
.fmt { font: 500 14px/1.4 var(--mono); background: var(--sunk); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: nowrap }
.fmt-ex { font: 400 13px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere }
.rule-item { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line) }
.rule-item:last-child { border-bottom: none }
.rule-item b { font-weight: 600 }
table.dec { width: 100%; border-collapse: collapse; font-size: 14px }
table.dec td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top }
table.dec td:first-child { font: 500 14px/1.3 var(--mono); white-space: nowrap; width: 1%; padding-right: 12px }
table.dec tr:last-child td { border-bottom: none }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
<style>
[hidden] { display: none !important }
body { margin: 0; padding-top: calc(18px + env(safe-area-inset-top, 0px)) }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div>
      <div class="eyebrow">Suspension HEK293 · 2 L shake flasks</div>
      <h1>Passage Bench</h1>
    </div>
    <div class="sub" id="topsub"></div>
  </header>

  <!-- TOOLS -->
  <section id="s-tools" data-screen="tools" class="stack">
    <div id="toollist" class="stack">
      <div class="section-title"><span class="label">At the hood</span></div>
      <div class="tools" id="tools-main"></div>
      <div class="section-title"><span class="label">Planning and analysis</span></div>
      <div class="tools" id="tools-plan"></div>
    </div>
    <div id="toolview" class="stack" hidden></div>
  </section>

  <!-- LABELS -->
  <section id="s-labels" data-screen="labels" class="stack" hidden>
    <div class="seg wrap4" role="group" aria-label="Labels view">
      <button data-lv="flasks" aria-pressed="true">My flasks</button>
      <button data-lv="build" aria-pressed="false">Build</button>
      <button data-lv="decode" aria-pressed="false">Decode</button>
      <button data-lv="rules" aria-pressed="false">Rules</button>
    </div>
    <div id="lv-flasks" class="stack"></div>
    <div id="lv-build" class="stack" hidden></div>
    <div id="lv-decode" class="stack" hidden></div>
    <div id="lv-rules" class="stack" hidden></div>
  </section>

  <!-- PROTOCOL -->
  <section id="s-protocol" data-screen="protocol" class="stack" hidden>
    <div class="seg" role="group" aria-label="Protocol">
      <button data-proto="pass" aria-pressed="true">Passaging</button>
      <button data-proto="thaw" aria-pressed="false">Thawing</button>
    </div>
    <div class="seg" role="group" aria-label="Protocol view">
      <button id="pv-steps" aria-pressed="true">Steps</button>
      <button id="pv-check" aria-pressed="false">Bench checklist</button>
    </div>
    <div id="pv-steps-view" class="steps"></div>
    <div id="pv-check-view" class="stack" hidden></div>
  </section>

  <!-- LEARN -->
  <section id="s-learn" data-screen="learn" class="stack" hidden></section>

  <!-- SETTINGS -->
  <section id="s-settings" data-screen="settings" class="stack" hidden></section>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="in">
    <button data-tab="tools" aria-current="page"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h2M16 15v3"/></svg>Tools</button>
    <button data-tab="labels"><svg viewBox="0 0 24 24"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></svg>Labels</button>
    <button data-tab="protocol"><svg viewBox="0 0 24 24"><path d="M9 4h6M10 4v5l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V4"/><path d="M7.5 15h9"/></svg>Protocol</button>
    <button data-tab="learn"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Learn</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Lab values</button>
  </div>
</nav>

<script>
/* ---------- storage ---------- */
const KEY = "hekbench.v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const store = load();
store.settings = store.settings || {};
store.inputs = store.inputs || {};
store.check = store.check || {};
store.notes = store.notes || "";
store.flasks = store.flasks || [];
store.ident = store.ident || {};
store.lab = store.lab || {};

/* ---------- lab values (defaults = placeholders until confirmed) ---------- */
const SETTINGS = [
  { id: "seed", t: "Seeding density, next passage in 4 days", h: "Preferred interval. Lower density because the cells grow one day longer", u: "e6/mL", def: 0.3, conf: true },
  { id: "seed3", t: "Seeding density, next passage in 3 days", h: "Higher density because the cells have one day less to grow (seen in the ELN template)", u: "e6/mL", def: 0.55, conf: true },
  { id: "p1vol", t: "First passage after thaw: volume", h: "500 mL flask", u: "mL", def: 200, conf: true },
  { id: "passMin", t: "Passage window, lower VCD", h: "Below this, the flask is usually not split yet", u: "e6/mL", def: 2.0, conf: false },
  { id: "passMax", t: "Passage window, upper VCD", h: "Above this, cells risk leaving exponential growth", u: "e6/mL", def: 4.0, conf: false },
  { id: "vol", t: "Working volume", h: "Culture volume per flask", u: "mL", def: 800, conf: true },
  { id: "flask", t: "Flask nominal size", h: "Shake flask capacity", u: "mL", def: 2000, conf: true },
  { id: "viab", t: "Minimum viability", h: "Below this, flag the flask", u: "%", def: 95, conf: false },
  { id: "td", t: "Doubling time", h: "Lab value; compare with your own in the growth tool", u: "h", def: 24, conf: true },
  { id: "days", t: "Days between passages", h: "Usual interval", u: "days", def: 3.5, conf: true },
  { id: "thawVol", t: "Thaw: final volume", h: "Vial + medium in the thaw flask", u: "mL", def: 50, conf: true },
  { id: "thawVcd", t: "Thaw: expected VCD", h: "First count right after seeding", u: "e6/mL", def: 0.3, conf: true },
  { id: "thawViab", t: "Thaw: minimum viability", h: "First count right after seeding", u: "%", def: 90, conf: true },
  { id: "maxP", t: "Maximum passage number", h: "Cell age limit after thaw; restart from a new vial after this", u: "P", def: 10, conf: true }
];
function S(id) { const d = SETTINGS.find(s => s.id === id); const v = store.settings[id]; return v && v.val !== undefined && v.val !== "" ? +v.val : d.def; }
function Sconf(id) { const d = SETTINGS.find(s => s.id === id); const v = store.settings[id]; return v && v.conf !== undefined ? v.conf : d.conf; }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function f(x, d = 1) { if (!isFinite(x)) return "–"; return x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); }
function sig(x) { if (!isFinite(x)) return "–"; const a = Math.abs(x); return f(x, a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3); }
function cells(x) { if (!isFinite(x)) return "–"; if (x >= 1e9) return f(x / 1e9, 2) + " × 10⁹"; return f(x / 1e6, 1) + " × 10⁶"; }
const PIPS = [5, 10, 25, 50, 100];
const FLASKS = [{ n: "250 mL", v: 50 }, { n: "500 mL", v: 200 }, { n: "2 L", v: 800 }];
function pipetting(v) {
  if (!(v > 0)) return "";
  if (v < 1) return "Use a micropipette (" + f(v * 1000, 0) + " µL)";
  if (v <= 100) { const p = PIPS.find(p => p >= v); return "One " + p + " mL pipette"; }
  const full = Math.floor(v / 100); const rest = v - full * 100;
  if (rest < 0.05) return full + " × 100 mL";
  const p = PIPS.find(p => p >= rest);
  return full + " × 100 mL + " + f(rest, 1) + " mL (" + p + " mL pipette)";
}

/* ---------- calculators ---------- */
const TOOLS = [
  {
    id: "split", group: "main", ic: "÷", title: "Routine split", d: "From your count to culture and medium volumes",
    modes: [{ id: "d4", l: "Next passage in 4 days" }, { id: "d3", l: "In 3 days" }], modeResets: ["t"],
    fields: [
      { id: "m", label: "Measured VCD", u: "e6/mL", def: () => 3.0 },
      { id: "via", label: "Viability", u: "%", def: () => 97 },
      { id: "t", label: "Target seeding VCD", u: "e6/mL", def: m => m === "d3" ? S("seed3") : S("seed"), set: m => m === "d3" ? "seed3" : "seed" },
      { id: "v", label: "Working volume of new flask", u: "mL", def: () => "" },
      { id: "n", label: "New flasks from this one", u: "flasks", def: () => 1 },
      { id: "src", label: "Culture in source flask", u: "mL", def: () => "" }
    ],
    presets: { field: "v", label: "New flask", options: FLASKS.map(x => ({ l: x.n + " · " + x.v + " mL", v: x.v })) },
    formula: "V_culture = target VCD × final volume / measured VCD\nV_medium  = final volume − V_culture",
    how: ["Measured and target VCD must be in the same unit (here ×10⁶ cells/mL).", "Add the fresh medium to the new flask first, then the culture volume.", "Each replicate flask is calculated from its own count.", "Working volume is always the flask's maximum: 250 mL flask → 50 mL, 500 mL → 200 mL, 2 L → 800 mL.", "The flask is scaled up at each passage when the cell count allows, so the working volume is entered every time."],
    calc(v) {
      const out = { res: [], msgs: [] };
      if (!(v.v > 0)) return { err: "Enter the working volume of the new flask (or tap a flask size). It's entered at every passage because the flask is scaled up whenever possible." };
      if (!(v.m > 0 && v.t > 0)) return { err: "Enter the measured VCD and the target VCD." };
      if (v.t >= v.m) return { err: "Target VCD is at or above the measured VCD, so there is nothing to split. Use the top-up tool if you need more cells." };
      const vc = v.t * v.v / v.m, vm = v.v - vc, n = v.n > 0 ? Math.round(v.n) : 1;
      out.res.push({ big: true, l: "Culture to transfer, per flask", v: f(vc, 1) + " mL", i: pipetting(vc) });
      out.res.push({ l: "Fresh medium, per flask", v: f(vm, 1) + " mL", i: pipetting(vm) });
      out.res.push({ l: "Split ratio", v: "1 : " + f(v.v / vc, 1), i: "dilution factor " + f(v.m / v.t, 2) + "×" });
      if (n > 1) {
        out.res.push({ l: "Culture needed, " + n + " flasks", v: f(vc * n, 1) + " mL" });
        out.res.push({ l: "Medium needed, " + n + " flasks", v: f(vm * n, 1) + " mL" });
      }
      out.res.push({ l: "Viable cells seeded per flask", v: cells(v.t * 1e6 * v.v) });
      if (v.src > 0) {
        const maxN = Math.floor(v.src / vc);
        if (vc * n > v.src) out.msgs.push({ c: "bad", t: "Not enough culture: " + n + " flasks need " + f(vc * n, 1) + " mL but the source holds " + f(v.src, 0) + " mL. Maximum is " + maxN + " flask" + (maxN === 1 ? "" : "s") + "." });
        else out.res.push({ l: "Max flasks from source", v: String(maxN), i: "left in source: " + f(v.src - vc * n, 1) + " mL" });
        const ok = FLASKS.filter(x => v.t * x.v / v.m <= v.src), big = ok[ok.length - 1];
        out.res.push({ l: "Largest flask this source can seed", v: big ? big.n + " (" + big.v + " mL)" : "none", i: FLASKS.map(x => x.n + ": " + f(v.t * x.v / v.m, 1) + " mL").join(" · ") });
        if (big && big.v > v.v) out.msgs.push({ c: "info", t: "Enough cells to scale up to a " + big.n + " flask (" + big.v + " mL). Flasks are scaled up at each passage when possible." });
      } else out.msgs.push({ c: "info", t: "Add the culture volume in the source flask to see whether you can scale up." });
      if (v.via > 0 && v.via < S("viab")) out.msgs.push({ c: "warn", t: "Viability " + f(v.via, 1) + "% is below your threshold (" + S("viab") + "%). Flag it before passaging." });
      else if (v.via >= S("viab")) out.msgs.push({ c: "good", t: "Viability OK (≥ " + S("viab") + "%)." });
      if (v.m < S("passMin")) out.msgs.push({ c: "warn", t: "Measured VCD is below the passage window (" + S("passMin") + "–" + S("passMax") + " × 10⁶/mL). Consider waiting." });
      if (v.m > S("passMax")) out.msgs.push({ c: "warn", t: "Measured VCD is above the passage window (" + S("passMin") + "–" + S("passMax") + " × 10⁶/mL). Cells may be leaving exponential phase; note it in the ELN." });
      if (vc > v.v * 0.5) out.msgs.push({ c: "warn", t: "More than half the final volume is old culture. Spent medium will carry over; check the numbers." });
      return out;
    }
  },
  {
    id: "topup", group: "main", ic: "+", title: "VCD too low: add inoculum", d: "After the split, bring the flask up to target",
    modes: [{ id: "add", l: "Add (volume grows)" }, { id: "swap", l: "Keep volume" }],
    fields: [
      { id: "c0", label: "VCD in flask now", u: "e6/mL", def: () => 0.25 },
      { id: "ct", label: "Target VCD", u: "e6/mL", def: () => S("seed"), set: "seed" },
      { id: "v0", label: "Volume in flask now", u: "mL", def: () => S("vol"), set: "vol" },
      { id: "ci", label: "Inoculum VCD", u: "e6/mL", def: () => 3.0 }
    ],
    formula: {
      add: "x = V × (target − current) / (inoculum − target)\nfinal volume = V + x",
      swap: "1. Remove x of the flask culture\n2. Add x of inoculum\nx = V × (target − current) / (inoculum − current)"
    },
    how: ["The inoculum is usually the source flask you just split from.", "Quick formula (target − current) × V / inoculum ignores the volume you add, so it lands slightly under target. The exact result is shown below with the quick one for comparison.", "\"Keep volume\" removes culture first so the flask stays at its working volume."],
    calc(v, mode) {
      const out = { res: [], msgs: [] };
      if (!(v.c0 >= 0 && v.ct > 0 && v.v0 > 0 && v.ci > 0)) return { err: "Enter all four values." };
      if (v.ct <= v.c0) return { err: "The flask is already at or above target. Use the dilute tool instead." };
      if (v.ci <= v.ct) return { err: "The inoculum must be denser than the target VCD, otherwise adding it can never reach the target." };
      if (mode === "swap") {
        const x = v.v0 * (v.ct - v.c0) / (v.ci - v.c0);
        out.res.push({ big: true, l: "Remove, then add inoculum", v: f(x, 1) + " mL", i: "remove " + f(x, 1) + " mL culture → add " + f(x, 1) + " mL inoculum" });
        out.res.push({ l: "Final volume", v: f(v.v0, 0) + " mL" });
        out.res.push({ l: "Final VCD", v: sig(v.ct) + " e6/mL" });
        out.res.push({ l: "Pipetting", v: pipetting(x) || "–" });
      } else {
        const x = v.v0 * (v.ct - v.c0) / (v.ci - v.ct);
        const xq = (v.ct - v.c0) * v.v0 / v.ci;
        const cq = (v.c0 * v.v0 + v.ci * xq) / (v.v0 + xq);
        out.res.push({ big: true, l: "Inoculum to add", v: f(x, 1) + " mL", i: pipetting(x) });
        out.res.push({ l: "Final volume", v: f(v.v0 + x, 1) + " mL" });
        out.res.push({ l: "Final VCD", v: sig(v.ct) + " e6/mL" });
        out.res.push({ l: "Quick formula would add", v: f(xq, 1) + " mL", i: "→ final VCD " + sig(cq) + " e6/mL (" + f((cq / v.ct - 1) * 100, 1) + "%)" });
        if (v.v0 + x > S("vol") * 1.1) out.msgs.push({ c: "warn", t: "Final volume is more than 10% above the usual " + S("vol") + " mL. Consider \"Keep volume\" to protect oxygen transfer." });
      }
      return out;
    }
  },
  {
    id: "dilute", group: "main", ic: "−", title: "VCD too high: dilute", d: "Bring an over-dense flask down to target",
    modes: [{ id: "add", l: "Add medium" }, { id: "swap", l: "Keep volume" }],
    fields: [
      { id: "c0", label: "VCD in flask now", u: "e6/mL", def: () => 0.45 },
      { id: "ct", label: "Target VCD", u: "e6/mL", def: () => S("seed"), set: "seed" },
      { id: "v0", label: "Volume in flask now", u: "mL", def: () => S("vol"), set: "vol" }
    ],
    formula: {
      add: "x = V × (current / target − 1)\nfinal volume = V + x",
      swap: "1. Remove r of the flask culture\n2. Add r of fresh medium\nr = V × (1 − target / current)"
    },
    how: ["Use fresh pre-warmed medium.", "\"Keep volume\" discards culture first so the flask stays at its working volume."],
    calc(v, mode) {
      const out = { res: [], msgs: [] };
      if (!(v.c0 > 0 && v.ct > 0 && v.v0 > 0)) return { err: "Enter all three values." };
      if (v.ct >= v.c0) return { err: "The flask is already at or below target. Use the top-up tool instead." };
      if (mode === "swap") {
        const r = v.v0 * (1 - v.ct / v.c0);
        out.res.push({ big: true, l: "Remove, then add medium", v: f(r, 1) + " mL", i: "remove " + f(r, 1) + " mL culture → add " + f(r, 1) + " mL medium" });
        out.res.push({ l: "Final volume", v: f(v.v0, 0) + " mL" });
        out.res.push({ l: "Pipetting", v: pipetting(r) || "–" });
      } else {
        const x = v.v0 * (v.c0 / v.ct - 1);
        out.res.push({ big: true, l: "Fresh medium to add", v: f(x, 1) + " mL", i: pipetting(x) });
        out.res.push({ l: "Final volume", v: f(v.v0 + x, 1) + " mL" });
        if (v.v0 + x > S("vol") * 1.1) out.msgs.push({ c: "warn", t: "Final volume is more than 10% above the usual " + S("vol") + " mL. Consider \"Keep volume\", or split the excess into a second flask." });
        if (v.v0 + x > S("flask") * 0.5) out.msgs.push({ c: "bad", t: "Over half the flask's nominal volume (" + S("flask") + " mL). Oxygen transfer will suffer." });
      }
      return out;
    }
  },
  {
    id: "thaw", group: "main", ic: "❄", title: "Thaw check", d: "Post-thaw count: recovery, vial density, days to first passage",
    fields: [
      { id: "vcd", label: "Measured VCD after thaw", u: "e6/mL", def: () => 0.3 },
      { id: "via", label: "Viability", u: "%", def: () => 92 },
      { id: "vv", label: "Vial volume added", u: "mL", def: () => 1 },
      { id: "vt", label: "Final volume in flask", u: "mL", def: () => S("thawVol"), set: "thawVol" },
      { id: "exp", label: "Expected VCD", u: "e6/mL", def: () => S("thawVcd"), set: "thawVcd" },
      { id: "dmso", label: "DMSO in vial (assumed)", u: "%", def: () => 10 }
    ],
    formula: "medium         = final volume − vial volume\nviable cells   = VCD × final volume\nvial density   = VCD × final volume / vial volume\nVCD on day d   = VCD × 2^(24 × d / Td)",
    how: ["Recovery compares your count with the expected post-thaw VCD.", "Day 3 / day 4 predictions assume steady growth with no lag; cells usually lag after a thaw, so expect lower.", "DMSO % in the vial is an assumption (10% is typical); check the cell bank record."],
    calc(v) {
      const out = { res: [], msgs: [] };
      if (!(v.vcd > 0 && v.vv > 0 && v.vt > 0)) return { err: "Enter the measured VCD, vial volume and final volume." };
      if (v.vv >= v.vt) return { err: "Final volume must be larger than the vial volume." };
      const tot = v.vcd * 1e6 * v.vt;
      out.res.push({ big: true, l: "Viable cells recovered", v: cells(tot), i: "medium to prepare: " + f(v.vt - v.vv, 0) + " mL · dilution 1:" + f(v.vt / v.vv, 0) });
      if (v.exp > 0) out.res.push({ l: "vs expected VCD", v: f(v.vcd / v.exp * 100, 0) + "%", i: "expected " + sig(v.exp) + " e6/mL" });
      out.res.push({ l: "Implied viable density in vial", v: sig(v.vcd * v.vt / v.vv) + " e6/mL" });
      if (v.dmso >= 0) out.res.push({ l: "DMSO after dilution", v: f(v.dmso * v.vv / v.vt, 2) + "%" });
      const lo = S("passMin"), td = S("td");
      const d3 = v.vcd * Math.pow(2, 72 / td), d4 = v.vcd * Math.pow(2, 96 / td);
      out.res.push({ l: "Predicted VCD, day 3 / day 4", v: sig(d3) + " / " + sig(d4), i: "e6/mL · Td " + f(td, 0) + " h, no lag" });
      const need = S("seed") * 1e6 * S("p1vol");
      out.res.push({ l: "First passage needs", v: cells(need), i: f(S("p1vol"), 0) + " mL at " + sig(S("seed")) + " e6/mL (500 mL flask)" });
      if (v.via > 0 && v.via < S("thawViab")) out.msgs.push({ c: "bad", t: "Viability " + f(v.via, 1) + "% is below the post-thaw criterion (> " + S("thawViab") + "%). Flag it before continuing." });
      else if (v.via >= S("thawViab")) out.msgs.push({ c: "good", t: "Viability OK (> " + S("thawViab") + "%)." });
      if (v.exp > 0 && v.vcd < v.exp * 0.8) out.msgs.push({ c: "warn", t: "VCD is more than 20% below the expected " + sig(v.exp) + " e6/mL. Check mixing before sampling, the count, and the vial record." });
      if (v.exp > 0 && v.vcd > v.exp * 1.2) out.msgs.push({ c: "info", t: "VCD is more than 20% above expected. Fine for the cells; note it in the ELN." });
      if (v.via > 0 && v.via < S("thawViab") || (v.exp > 0 && v.vcd < v.exp * 0.8)) out.msgs.push({ c: "info", t: "If the count is off, the lab's fallback is to thaw another vial, after discussing it first." });
      out.msgs.push({ c: "info", t: "First passage on day 3 or 4, preferably day 4, scaling up to a 500 mL flask (200 mL)." });
      if (!Sconf("td")) out.msgs.push({ c: "warn", t: "Day 3 / day 4 predictions use a placeholder doubling time." });
      return out;
    }
  },
  {
    id: "growth", group: "plan", ic: "td", title: "Growth and doubling time", d: "From seeding VCD to today's count",
    fields: [
      { id: "n0", label: "VCD at seeding", u: "e6/mL", def: () => S("seed") },
      { id: "n1", label: "VCD now", u: "e6/mL", def: () => 3.0 },
      { id: "t", label: "Time since seeding", u: "h", def: () => 72 },
      { id: "cpd", label: "Previous cumulative PD (optional)", u: "PD", def: () => 0 }
    ],
    formula: "PD  = log2(VCD now / VCD seeded)\nTd  = t × ln 2 / ln(VCD now / VCD seeded)\nμ   = ln(VCD now / VCD seeded) / t",
    how: ["Works because the volume doesn't change between seeding and counting.", "Use viable densities for both points.", "72 h = 3 days, 96 h = 4 days. Use real hours if you know them."],
    calc(v) {
      const out = { res: [], msgs: [] };
      if (!(v.n0 > 0 && v.n1 > 0 && v.t > 0)) return { err: "Enter both densities and the time." };
      if (v.n1 <= v.n0) return { err: "VCD now is not higher than at seeding, so there's no growth to measure. Check the counts or viability." };
      const r = v.n1 / v.n0, pd = Math.log2(r), td = v.t * Math.LN2 / Math.log(r), mu = Math.log(r) / v.t;
      out.res.push({ big: true, l: "Doubling time", v: f(td, 1) + " h", i: f(td / 24, 2) + " days" });
      out.res.push({ l: "Population doublings", v: f(pd, 2) + " PD" });
      out.res.push({ l: "Fold expansion", v: f(r, 1) + "×" });
      out.res.push({ l: "Growth rate μ", v: f(mu * 24, 3) + " /day", i: f(mu, 4) + " /h" });
      if (v.cpd > 0) out.res.push({ l: "New cumulative PD", v: f(v.cpd + pd, 2) });
      if (td < 16) out.msgs.push({ c: "warn", t: "Faster than typical for HEK293. Double-check the counts and the time." });
      if (td > 40) out.msgs.push({ c: "warn", t: "Slow growth. Look at viability, clumping, medium and shaker settings." });
      out.msgs.push({ c: "info", t: "Tip: save this doubling time in Lab values to improve the seeding planner." });
      return out;
    }
  },
  {
    id: "plan", group: "plan", ic: "↦", title: "Seeding planner", d: "Pick a seeding VCD to hit a density on passage day",
    fields: [
      { id: "tgt", label: "VCD wanted on passage day", u: "e6/mL", def: () => (S("passMin") + S("passMax")) / 2 },
      { id: "days", label: "Days until next passage", u: "days", def: () => S("days") },
      { id: "td", label: "Doubling time", u: "h", def: () => S("td"), set: "td" },
      { id: "seed", label: "Or: planned seeding VCD", u: "e6/mL", def: () => S("seed") }
    ],
    formula: "seed VCD      = wanted VCD / 2^(hours / Td)\npredicted VCD = seed VCD × 2^(hours / Td)",
    how: ["Assumes steady exponential growth with no lag, so treat it as an estimate.", "Useful to choose between a 3-day and a 4-day interval (weekends)."],
    calc(v) {
      const out = { res: [], msgs: [] };
      if (!(v.days > 0 && v.td > 0)) return { err: "Enter the days and the doubling time." };
      const h = v.days * 24, k = Math.pow(2, h / v.td);
      if (v.tgt > 0) out.res.push({ big: true, l: "Seed at", v: sig(v.tgt / k) + " e6/mL", i: "to reach " + sig(v.tgt) + " e6/mL in " + f(v.days, 1) + " days" });
      if (v.seed > 0) out.res.push({ l: "Predicted VCD from planned seeding", v: sig(v.seed * k) + " e6/mL" });
      out.res.push({ l: "Expansion over interval", v: f(k, 1) + "×", i: f(h / v.td, 2) + " doublings" });
      const t3 = Math.pow(2, 72 / v.td), t4 = Math.pow(2, 96 / v.td);

      if (!Sconf("td")) out.msgs.push({ c: "warn", t: "Doubling time is a placeholder. Measure it with the growth tool." });

    }
  },
  {
    id: "cells", group: "plan", ic: "Σ", title: "Cell numbers and scale-up", d: "Total cells, and how many flasks a source can seed",
    fields: [
      { id: "vcd", label: "Source VCD", u: "e6/mL", def: () => 3.0 },
      { id: "vs", label: "Source volume", u: "mL", def: () => S("vol") },
      { id: "sd", label: "Seeding VCD", u: "e6/mL", def: () => S("seed"), set: "seed" },
      { id: "vt", label: "Volume per new flask / vessel", u: "mL", def: () => S("vol") },
      { id: "n", label: "Flasks / vessels wanted", u: "n", def: () => 2 }
    ],
    formula: "total cells   = VCD × volume\ncells needed  = seeding VCD × volume × n\nmax flasks    = floor(total / (seeding VCD × volume))",
    how: ["For a bioreactor, put its working volume in \"Volume per new flask / vessel\" and n = 1.", "×10⁶ cells/mL × mL = ×10⁶ cells."],
    calc(v) {

        out.res.push({ l: "Max flasks from source", v: String(Math.floor(tot / per)) });
        out.res.push({ l: "Cells needed for " + n, v: cells(per * n) });
        out.res.push({ l: "Source volume for " + n, v: f(per * n / (v.vcd * 1e6), 1) + " mL" });
        if (per * n > tot) out.msgs.push({ c: "bad", t: "Not enough cells for " + n + ". Short by " + cells(per * n - tot) + " cells; expand one more passage first." });
        else out.msgs.push({ c: "good", t: "Enough cells for " + n + ", with " + cells(tot - per * n) + " to spare." });
      }
      return out;
    }
  },
  {
    id: "c1v1", group: "plan", ic: "C₁", title: "C1V1 = C2V2", d: "Any simple dilution: solve for one missing value",
    modes: [{ id: "v1", l: "Find V1" }, { id: "c2", l: "Find C2" }, { id: "v2", l: "Find V2" }],
    fields: [
      { id: "c1", label: "C1 (stock)", u: "any", def: () => 3.0 },
      { id: "v1", label: "V1 (volume taken)", u: "mL", def: () => 100 },
      { id: "c2", label: "C2 (final)", u: "any", def: () => 0.3 },
      { id: "v2", label: "V2 (final volume)", u: "mL", def: () => 800 }
    ],
    formula: "C1 × V1 = C2 × V2",
    how: ["C1 and C2 in the same unit; V1 and V2 in the same unit.", "The field you solve for is ignored."],
    calc(v, mode) {

      if (mode === "c2") { if (!(v.c1 > 0 && v.v1 > 0 && v.v2 > 0)) return { err: "Enter C1, V1 and V2." }; out.res.push({ big: true, l: "C2", v: sig(v.c1 * v.v1 / v.v2) }); if (v.v1 > v.v2) out.msgs.push({ c: "bad", t: "V1 is larger than V2." }); }
      if (mode === "v2") { if (!(v.c1 > 0 && v.v1 > 0 && v.c2 > 0)) return { err: "Enter C1, V1 and C2." }; const r = v.c1 * v.v1 / v.c2; out.res.push({ big: true, l: "V2", v: sig(r) + " mL" }); out.res.push({ l: "Diluent to add", v: sig(r - v.v1) + " mL" }); }
      return out;
    }
  }
];

/* ---------- labels: GTDSPS naming conventions ---------- */
const escA = s => esc(s).replace(/"/g, "&quot;");
const pad2 = n => String(n).padStart(2, "0");
const norm = x => String(x == null ? "" : x).trim().toUpperCase().replace(/_/g, "-").replace(/\s+/g, "");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
function dayOfCulture(inoc, on) { if (!inoc) return NaN; const a = new Date(inoc + "T12:00:00"), b = new Date((on || todayISO()) + "T12:00:00"); return Math.round((b - a) / 86400000); }
function fmtDate(iso) { if (!iso) return "–"; const d = new Date(iso + "T12:00:00"); return isNaN(d) ? "–" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
const ME = () => norm(store.ident.init || "TLE");

const RE_PASS = /^(\d{2})-GK(\d{2,3})-V(\d{1,3})(?:-([A-Z]{2,4})(\d{2}))?-P(\d{1,2})-([A-Z]{2,4})(\d{2})(?:-(\d{1,2})(?:-(\d{1,2}))?)?$/;
function parsePassage(id) {
  const m = norm(id).match(RE_PASS); if (!m) return null;
  return { proj: m[1], gk: m[2], vial: m[3], pInit: m[4] || "", pNo: m[5] || "", p: +m[6], cInit: m[7], cNo: m[8], day: m[9], s: m[10] };
}
function passageId(o) { return `${o.proj}-GK${o.gk}-V${o.vial}${o.p > 0 && o.parent ? "-" + o.parent : ""}-P${o.p}-${o.child}`; }
const baseOf = o => passageId({ proj: o.proj, gk: o.gk, vial: o.vial, p: o.p, parent: o.pInit + o.pNo, child: o.cInit + o.cNo });
const sampleName = (base, day, s) => base + "-" + day + (s > 1 ? "-" + s : "");
const xt = id => id.replace(/-/g, "_");
const lineage = o => `${o.proj}-GK${o.gk}-V${o.vial}`;
function nextChildNo(proj, gk, vial, p, init) {
  let mx = 0;
  store.flasks.forEach(f => { const o = parsePassage(f.id); if (o && o.proj === proj && o.gk === gk && o.vial === vial && o.p === p && o.cInit === init) mx = Math.max(mx, +o.cNo); });
  return mx + 1;
}
function idRow(text, sub, big) {
  return `<div class="idrow${big ? " big" : ""}"><div style="min-width:0"><code>${esc(text).replace(/([-_])/g, "$1<wbr>")}</code>${sub ? `<small>${esc(sub)}</small>` : ""}</div><button class="copy" data-copy="${escA(text)}">Copy</button></div>`;
}
function anatomy(segs) { return `<div class="anatomy">${segs.map(s => `<span class="${s.c || ""}">${esc(s.t)}<i>${esc(s.i)}</i></span>`).join("")}</div>`; }
function passAnatomy(o, day, s) {
  const a = [{ t: o.proj, i: "project" }, { t: "GK" + o.gk, i: "cell bank" }, { t: "V" + o.vial, i: "vial" }];
  if (o.p > 0 && o.parent) a.push({ t: o.parent, i: "parent flask", c: "p" });
  a.push({ t: "P" + o.p, i: "passage" }, { t: o.child, i: "this flask", c: "c" });
  if (day !== undefined && day !== null && day !== "") a.push({ t: String(day), i: "day", c: "d" });
  if (s > 1) a.push({ t: String(s), i: "sample of day", c: "d" });
  return anatomy(a);
}

/* copy (delegated) */
function copyText(t, btn) {
  const done = () => { if (!btn) return; const l = btn.textContent; btn.textContent = "Copied"; btn.classList.add("done"); setTimeout(() => { btn.textContent = l === "Copied" ? "Copy" : l; btn.classList.remove("done"); }, 1300); };
  const fb = () => { const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "absolute"; ta.style.left = "-9999px"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb(); } catch (e) { fb(); }
}

}

      : `<div class="empty">Start with <b>+ New passage</b> (or <b>+ Thaw</b> for a vial). Save the labels you build and they'll appear here.</div>`}`;
}
$("#lv-flasks").addEventListener("click", e => {
  const b = e.target.closest("[data-fa]"); if (!b) return;

/* ---- Build ---- */
function freshPB(p) {
  return { proj: store.ident.proj || "", gk: store.ident.gk || "", vial: store.ident.vial || "", p: p == null ? 1 : p, parent: "", init: ME(), first: 1, n: 1, date: todayISO(), firstEdited: false };

  if ((m = id.match(/^(\d{2})-G(\d{2,3})-(\d{3})L-([A-Z]{3})R(\d+)-([A-Z]{2})(\d*)$/))) return { type: "DSP sample, end-to-end 50L/200L", rows: [[m[1], "Project code"], ["G" + m[2], "Batch"], [m[3] + "L", "Scale"], [m[4] + "R" + m[5], `${DSPOP[m[4]] || m[4]}, run ${m[5]}`], [m[6] + m[7], (DSPPH[m[6]] || m[6]) + (m[7] ? " " + m[7] : "")]], sum: "", warn };
  if ((m = id.match(/^(\d{2})-(\d{2})(\d{2})(\d{2})-([A-Z]{3})R(\d+)-([A-Z]{2})(\d*)$/))) return { type: "DSP sample", rows: [[m[1], "Project code"], [m[2] + m[3] + m[4], `Date 20${m[2]}-${m[3]}-${m[4]}`], [m[5] + "R" + m[6], `${DSPOP[m[5]] || m[5]}, run ${m[6]}`], [m[7] + m[8], (DSPPH[m[7]] || m[7]) + (m[8] ? " " + m[8] : "")]], sum: "", warn };
  if ((m = id.match(/^(\d{2})-G(\d{2,3})$/))) return { type: "Batch record", rows: [[m[1], "Project code"], ["G" + m[2], "Batch " + m[2]]], sum: `Batch ${m[2]} of project ${m[1]}.`, warn };
  if ((m = id.match(/^(\d{2})-G(\d{2,3})-(.+)$/))) {
    const t = m[3].split("-"); rows.push([m[1], "Project code"], ["G" + m[2], "Batch " + m[2]]);
    let osmo = false;
    if (/^\d{1,2}$/.test(t[0])) { osmo = true; const vt = t[t.length - 1]; const d = t[0], s = t.length === 3 ? t[1] : null; rows.push([d, `Day ${d}`]); if (s) rows.push([s, "Sample " + s]); rows.push([vt, vesselDesc(vt)]); return { type: "Osmotech Pro name (instrument only)", rows, sum: "Equipment-side name; the ELN uses the standard order.", warn }; }
    const v = t.shift(); rows.push([v, vesselDesc(v)]);
    const rest = t.join("-");
    let type = "Vessel in a batch experiment";
    if (v === "SF00" && !rest) type = "Parent shake flask, day 0 (to be split)";
    if (rest === "M") { rows.push(["M", "Media charge (no cells)"]); type = "Media charge, production bioreactor"; }
    else if (rest === "N-1-M") { rows.push(["N-1-M", "Media charge for the N-1"]); type = "Media charge, N-1"; }
    else if (rest === "N-1") { rows.push(["N-1", "N-1 run inside the production bioreactor"]); type = "N-1 in production bioreactor"; }
    else if (rest) {
      const d = t[0]; rows.push([d, `Day ${d} (inoculation = day 0)`]);
      const x = t.slice(1);
      if (!x.length) type = "In-process sample (first of the day)";
      else if (x.length === 1 && /^\d{1,2}$/.test(x[0])) { rows.push([x[0], "Sample " + x[0] + " that day"]); type = "In-process sample"; if (x[0] === "1") warn.push("The first sample of a day is not numbered; drop the -1."); }
      else if (x[0] === "L") { rows.push(["L", "Lysate"]); type = "Lysate"; }
      else if (x[0] === "P") { rows.push(["P", "Permeate"]); type = "Permeate (perfusion)"; }
      else if (/^[CLF]\d+$/.test(x[0])) { rows.push([x[0], `${{ C: "Clarified", L: "Post-lysis centrifuged", F: "Post-lysis filtered" }[x[0][0]]}, bag ${x[0].slice(1)}`]); type = "Clarified harvest sample"; if (x[1] === "EN") { rows.push(["EN", "Purified DSP material"]); type = "USP support sample"; } }

}
const DSPOP = { AFF: "Affinity chromatography", AEX: "Anion exchange chromatography", CEX: "Cation exchange chromatography", HIC: "Hydrophobic interaction chromatography", MMC: "Mixed-mode chromatography", TFF: "Tangential flow filtration", VRF: "Viral filtration", DVI: "Detergent viral inactivation", DFL: "Depth filtration", ERE: "Enzymatic reaction experiment" };
const DSPPH = { TH: "Thawed harvest", FH: "Filtered harvest", LD: "Load", FT: "Flowthrough", RE: "Re-equilibration", WA: "Wash", EN: "Elution", ST: "Strip", FL: "Filtrate", UL: "UF/DF load", RT: "UF/DF retentate", CH: "Chase (flush)", PO: "Pool (retentate + chase), non-filtered", RC: "Retentate during concentration", RD: "Retentate during diafiltration", PC: "Permeate during concentration", PD: "Permeate during diafiltration", DS: "DS bulk / DS sample", CF: "Post-chase 0.2 µm filtrate", RI: "Reaction input", RO: "Reaction output" };
function vesselDesc(v) {
  if (v === "RM50") return "RM50 rocker";
  const m = v.match(/^(.*?)(\d{2})$/);
  if (!m || !m[1]) return /^\d+L$/.test(v) ? v + " bioreactor" : "Vessel " + v;
  const t = m[1], n = m[2];
  const name = t === "SF" ? "Shake flask" : t === "250ML" ? "Ambr250 vessel" : /^\d+L$/.test(t) ? t + " bioreactor" : t;
  return `${name} n°${n}${t === "SF" && n === "00" ? " (parent, day 0)" : ""}`;
}
function renderDecode() {

    </div><div class="card" id="dec-out"></div>`;
  const inp = $("#dec-in");

}
function decOut() {
  const r = decode(store.lab.dec || ""), out = $("#dec-out");
  if (!r) { out.innerHTML = `<div class="label">Result</div><p class="small muted">Works for passage flasks and samples, vials, cell banks, batch records, vessels, in-process samples, lysates, harvests, media charges, complexation mixes, buffers and DSP samples. Underscores (Osmotech XT) are read as dashes.</p>`; return; }
  if (!r.type) { out.innerHTML = `<div class="label">Result</div><div class="msg bad">Not a recognised format. Compare it with the Rules tab.</div>${r.warn.map(w => `<div class="msg warn">${esc(w)}</div>`).join("")}`; return; }
  out.innerHTML = `<div class="label">Result</div><h3>${esc(r.type)}</h3>
    <table class="dec"><tbody>${r.rows.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</tbody></table>
    ${r.sum ? `<p>${esc(r.sum)}</p>` : ""}${r.warn.map(w => `<div class="msg warn">${esc(w)}</div>`).join("")}`;
}

/* ---- Rules ---- */

      ${R("Passage analysis (e.g. Vi-CELL count)", "XX-GKbb-Vv-[parent]-Pp-[child]-d(-s)", "99-GK78-V20-GGA01-P2-PSE01-3-2", "2nd measurement on day 3. Inoculation day = day 0.")}

      ${R("Inoculum (vial)", "XX-GKbb-Vv", "99-GK78-V4")}
      ${R("Complexation mix", "GTXX-Gbb-CMy", "GT98-G01-CM1")}

function tab(name) {
